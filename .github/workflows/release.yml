name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pre-install ViGEmBus driver (silent)
        shell: pwsh
        run: |
          # vgamepad 0.1.0 (the latest on PyPI) runs the ViGEmBus MSI *interactively* during
          # `pip install`, which hangs a headless runner. Installing the driver first makes
          # vgamepad's setup.py detect it (registry) and skip the interactive installer.
          python -m pip download vgamepad --no-deps --no-binary :all: -d vg_sdist
          $tar = (Get-ChildItem vg_sdist/vgamepad-*.tar.gz)[0].FullName
          tar -xf $tar -C vg_sdist
          $msi = (Get-ChildItem -Recurse vg_sdist -Filter ViGEmBusSetup_x64.msi)[0].FullName
          Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /norestart" -Wait
      - name: Install build tools and backends
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyserial pydirectinput pynput vgamepad
      - name: Build one-folder bundle
        run: python -m PyInstaller --clean --noconfirm DJI-RC-winGamePad.spec
      - name: Zip bundle and generate SHA-256
        shell: pwsh
        run: |
          $zip = "dist/DJI-RC-winGamePad-${{ github.ref_name }}.zip"
          Compress-Archive -Path dist/DJI-RC-winGamePad/* -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $zip -Leaf)" | Out-File -Encoding ascii "$zip.sha256"
      - name: Extract release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          $content = Get-Content -Raw CHANGELOG.md
          $pattern = "(?ms)^##\s*\[$([regex]::Escape($ver))\].*?(?=^##\s*\[|\z)"
          $m = [regex]::Match($content, $pattern)
          if (-not $m.Success) {
            $m = [regex]::Match($content, "(?ms)^##\s*\[Unreleased\].*?(?=^##\s*\[|\z)")
          }
          $notes = if ($m.Success) { $m.Value.Trim() } else { "Release ${{ github.ref_name }}" }
          Set-Content -Path release_notes.md -Value $notes -Encoding utf8
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DJI-RC-winGamePad
          path: |
            dist/DJI-RC-winGamePad-*.zip
            dist/DJI-RC-winGamePad-*.zip.sha256
      - name: Attach zip and checksum to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            dist/DJI-RC-winGamePad-*.zip
            dist/DJI-RC-winGamePad-*.zip.sha256
            dist/DJI-RC-winGamePad-test.exe.sha256
